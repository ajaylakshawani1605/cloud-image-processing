apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  NODE_ENV: production
  PORT: "3000"
  REDIS_URL: redis://redis:6379
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: http://localhost:9000
  S3_REGION: us-east-1
  S3_ORIGINAL_BUCKET: originals
  S3_OUTPUT_BUCKET: processed
  MAX_UPLOAD_MB: "10"
  MAX_IMAGE_PIXELS: "25000000"
  WORKER_CONCURRENCY: "1"
  JOB_ATTEMPTS: "3"
  PROCESS_TIMEOUT_MS: "60000"
  RETENTION_DAYS: "7"
  CORS_ORIGINS: http://localhost:8080,http://cloudframe.local
  PYTHON_BIN: python
