# LOCAL DEMO VALUES ONLY. Copy to .local/secret.yaml (ignored) and replace for shared clusters.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: cloudframe
type: Opaque
stringData:
  POSTGRES_USER: imageapp
  POSTGRES_PASSWORD: local-postgres-change-me
  POSTGRES_DB: imageapp
  DATABASE_URL: postgresql://imageapp:local-postgres-change-me@postgres:5432/imageapp
  MINIO_ROOT_USER: localminio
  MINIO_ROOT_PASSWORD: local-minio-change-me
  S3_ACCESS_KEY: localminio
  S3_SECRET_KEY: local-minio-change-me
  GF_SECURITY_ADMIN_PASSWORD: local-grafana-change-me
