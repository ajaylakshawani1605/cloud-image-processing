apiVersion: apps/v1
kind: Deployment
metadata: {name: api}
spec:
  replicas: 1
  selector: {matchLabels: {app: api}}
  template:
    metadata:
      labels: {app: api}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "3000", prometheus.io/path: /api/v1/metrics}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000}
      initContainers:
        - name: migrate
          image: cloudframe-api:local
          imagePullPolicy: IfNotPresent
          command: [sh, -c, 'until npm run db:migrate; do sleep 5; done']
          envFrom: [{configMapRef: {name: app-config}}, {secretRef: {name: app-secrets}}]
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 384Mi}}
      containers:
        - name: api
          image: cloudframe-api:local
          imagePullPolicy: IfNotPresent
          command: [node, dist/backend/src/server.js]
          envFrom: [{configMapRef: {name: app-config}}, {secretRef: {name: app-secrets}}]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          ports: [{containerPort: 3000}]
          resources: {requests: {cpu: 100m, memory: 192Mi}, limits: {cpu: "1", memory: 512Mi}}
          startupProbe: {httpGet: {path: /api/v1/health/live, port: 3000}, periodSeconds: 5, failureThreshold: 36}
          readinessProbe: {httpGet: {path: /api/v1/health/ready, port: 3000}, periodSeconds: 10, timeoutSeconds: 5}
          livenessProbe: {httpGet: {path: /api/v1/health/live, port: 3000}, periodSeconds: 20}
---
apiVersion: v1
kind: Service
metadata: {name: api}
spec: {selector: {app: api}, ports: [{port: 3000, targetPort: 3000}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: worker}
spec:
  replicas: 1
  selector: {matchLabels: {app: worker}}
  template:
    metadata: {labels: {app: worker}}
    spec:
      terminationGracePeriodSeconds: 90
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000}
      initContainers:
        - name: wait-for-api
          image: busybox:1.37
          command: [sh, -c, 'until wget -q -O /dev/null http://api:3000/api/v1/health/ready; do sleep 5; done']
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {cpu: 100m, memory: 32Mi}}
      containers:
        - name: worker
          image: cloudframe-worker:local
          imagePullPolicy: IfNotPresent
          envFrom: [{configMapRef: {name: app-config}}, {secretRef: {name: app-secrets}}]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          ports: [{containerPort: 3001}]
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}
          startupProbe: {httpGet: {path: /health/live, port: 3001}, periodSeconds: 5, failureThreshold: 24}
          readinessProbe: {httpGet: {path: /health/ready, port: 3001}, periodSeconds: 10, timeoutSeconds: 5}
          livenessProbe: {httpGet: {path: /health/live, port: 3001}, periodSeconds: 20}
---
apiVersion: v1
kind: Service
metadata: {name: worker}
spec: {selector: {app: worker}, ports: [{port: 3001, targetPort: 3001}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend}
spec:
  replicas: 1
  selector: {matchLabels: {app: frontend}}
  template:
    metadata: {labels: {app: frontend}}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: frontend
          image: cloudframe-frontend:local
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080}]
          resources: {requests: {cpu: 25m, memory: 32Mi}, limits: {cpu: 500m, memory: 96Mi}}
          readinessProbe: {httpGet: {path: /, port: 8080}, initialDelaySeconds: 3}
          livenessProbe: {httpGet: {path: /, port: 8080}, initialDelaySeconds: 15, periodSeconds: 20}
---
apiVersion: v1
kind: Service
metadata: {name: frontend}
spec: {selector: {app: frontend}, ports: [{port: 8080, targetPort: 8080}]}
