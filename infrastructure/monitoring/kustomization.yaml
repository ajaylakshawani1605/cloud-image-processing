apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cloudframe
resources: [kubernetes-resources.yaml]
configMapGenerator:
  - name: prometheus-config
    files: [prometheus.yml, alerts.yml]
  - name: grafana-datasources
    files: [grafana/provisioning/datasources/prometheus.yml]
  - name: grafana-providers
    files: [grafana/provisioning/dashboards/default.yml]
  - name: grafana-dashboard
    files: [grafana/dashboards/cloudframe.json]
