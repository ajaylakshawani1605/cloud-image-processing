apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: prometheus-data}
spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 1Gi}}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: grafana-data}
spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 1Gi}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: prometheus}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: prometheus}}
  template:
    metadata: {labels: {app: prometheus}}
    spec:
      automountServiceAccountToken: false
      securityContext: {fsGroup: 65534}
      containers:
        - name: prometheus
          image: prom/prometheus:v3.7.1
          args: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=7d]
          ports: [{containerPort: 9090}]
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 500m, memory: 256Mi}}
          readinessProbe: {httpGet: {path: /-/ready, port: 9090}, initialDelaySeconds: 5}
          livenessProbe: {httpGet: {path: /-/healthy, port: 9090}, initialDelaySeconds: 20}
          volumeMounts: [{name: config, mountPath: /etc/prometheus}, {name: data, mountPath: /prometheus}]
      volumes: [{name: config, configMap: {name: prometheus-config}}, {name: data, persistentVolumeClaim: {claimName: prometheus-data}}]
---
apiVersion: v1
kind: Service
metadata: {name: prometheus}
spec: {selector: {app: prometheus}, ports: [{port: 9090, targetPort: 9090}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: grafana}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: grafana}}
  template:
    metadata: {labels: {app: grafana}}
    spec:
      automountServiceAccountToken: false
      securityContext: {fsGroup: 472}
      containers:
        - name: grafana
          image: grafana/grafana:12.2.1
          env:
            - {name: GF_SECURITY_ADMIN_PASSWORD, valueFrom: {secretKeyRef: {name: app-secrets, key: GF_SECURITY_ADMIN_PASSWORD}}}
            - {name: GF_USERS_ALLOW_SIGN_UP, value: "false"}
          ports: [{containerPort: 3000}]
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 500m, memory: 256Mi}}
          readinessProbe: {httpGet: {path: /api/health, port: 3000}, initialDelaySeconds: 10}
          livenessProbe: {httpGet: {path: /api/health, port: 3000}, initialDelaySeconds: 30}
          volumeMounts:
            - {name: data, mountPath: /var/lib/grafana}
            - {name: datasources, mountPath: /etc/grafana/provisioning/datasources}
            - {name: providers, mountPath: /etc/grafana/provisioning/dashboards}
            - {name: dashboard, mountPath: /var/lib/grafana/dashboards}
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: grafana-data}}
        - {name: datasources, configMap: {name: grafana-datasources}}
        - {name: providers, configMap: {name: grafana-providers}}
        - {name: dashboard, configMap: {name: grafana-dashboard}}
---
apiVersion: v1
kind: Service
metadata: {name: grafana}
spec: {selector: {app: grafana}, ports: [{port: 3000, targetPort: 3000}]}
