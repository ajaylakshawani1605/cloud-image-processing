name: cloudframe
x-app-env: &app-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-imageapp}:${POSTGRES_PASSWORD:?Copy .env.example to .env}@postgres:5432/${POSTGRES_DB:-imageapp}
  REDIS_URL: redis://redis:6379
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
  S3_ORIGINAL_BUCKET: ${S3_ORIGINAL_BUCKET:-originals}
  S3_OUTPUT_BUCKET: ${S3_OUTPUT_BUCKET:-processed}
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
  MAX_IMAGE_PIXELS: ${MAX_IMAGE_PIXELS:-25000000}
  RETENTION_DAYS: ${RETENTION_DAYS:-7}
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-imageapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-imageapp}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"], interval: 5s, timeout: 3s, retries: 20}
    mem_limit: 384m
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20}
    mem_limit: 256m
    restart: unless-stopped
  minio:
    image: cloudframe-minio:local
    build: {context: ., dockerfile: infrastructure/docker/minio.Dockerfile}
    command: server /data --console-address :9001
    environment: {MINIO_ROOT_USER: "${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}", MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}"}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio-data:/data"]
    healthcheck: {test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"], interval: 5s, timeout: 3s, retries: 20}
    mem_limit: 512m
    restart: unless-stopped
  api:
    build: {context: ., dockerfile: backend/Dockerfile}
    env_file: .env
    environment:
      <<: *app-env
      PORT: 3000
    ports: ["127.0.0.1:3000:3000"]
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}, minio: {condition: service_healthy}}
    healthcheck: {test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 10s, timeout: 5s, retries: 15, start_period: 30s}
    mem_limit: 512m
    restart: unless-stopped
  worker:
    build: {context: ., dockerfile: queue-bridge/Dockerfile}
    env_file: .env
    environment:
      <<: *app-env
      PYTHON_BIN: python
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      JOB_ATTEMPTS: ${JOB_ATTEMPTS:-3}
      PROCESS_TIMEOUT_MS: ${PROCESS_TIMEOUT_MS:-60000}
    depends_on: {api: {condition: service_healthy}}
    healthcheck: {test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 10s, timeout: 5s, retries: 10}
    stop_grace_period: 90s
    mem_limit: 1g
    cpus: 1.0
    restart: unless-stopped
  frontend:
    build: {context: ., dockerfile: frontend/Dockerfile}
    ports: ["127.0.0.1:8080:8080"]
    depends_on: {api: {condition: service_healthy}}
    mem_limit: 96m
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.7.1
    profiles: [monitoring]
    ports: ["127.0.0.1:9090:9090"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes: ["./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "./infrastructure/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro", "prometheus-data:/prometheus"]
    mem_limit: 256m
    restart: unless-stopped
  grafana:
    image: grafana/grafana:12.2.1
    profiles: [monitoring]
    ports: ["127.0.0.1:3002:3000"]
    environment: {GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}", GF_USERS_ALLOW_SIGN_UP: "false"}
    volumes: ["./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro", "./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro", "grafana-data:/var/lib/grafana"]
    mem_limit: 256m
    restart: unless-stopped
networks:
  default: {name: cloudframe-internal}
volumes:
  postgres-data:
  redis-data:
  minio-data:
  prometheus-data:
  grafana-data:
